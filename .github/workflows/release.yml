name: Publish installable release
on:
  push:
    branches: [main]
    paths: ['fvtt/system.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - name: Publish versioned assets and latest manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('fvtt/system.json')).version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; bump fvtt/system.json for a new release."
            exit 0
          fi
          gh release create "$TAG" dist/boltaction.zip dist/system.json dist/web-builder.zip --target "$GITHUB_SHA" --latest --title "$TAG" --notes "Unofficial Bolt Action 2e alpha for Foundry V14. Live Foundry validation remains pending; specialist rules require manual adjudication."
